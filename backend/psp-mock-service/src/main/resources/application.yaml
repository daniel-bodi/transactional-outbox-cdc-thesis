springdotenv:
  directory: ../../

server:
  port: ${PSP_MOCK_PORT}

spring:
  application:
    name: psp-mock-service

  datasource:
    url: jdbc:postgresql://${PSP_DB_HOST}:${PSP_DB_PORT}/${PSP_DB_NAME}
    username: ${PSP_DB_USER}
    password: ${PSP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level [traceId:%X{traceId} spanId:%X{spanId}] %logger{36} - %msg%n"
