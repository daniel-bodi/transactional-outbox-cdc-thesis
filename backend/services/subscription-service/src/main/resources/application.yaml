springdotenv:
  directory: ../../../

server:
  port: ${SUBSCRIPTION_SERVICE_PORT}

spring:
  application:
    name: subscription-service

  datasource:
    url: jdbc:postgresql://${SUBSCRIPTION_DB_HOST}:${SUBSCRIPTION_DB_PORT}/${SUBSCRIPTION_DB_NAME}
    username: ${SUBSCRIPTION_DB_USER}
    password: ${SUBSCRIPTION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # default 30s
      connection-timeout: 2000

  jpa:
    # the database connection is released after the transaction instead of the end of the request
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:database/migration

  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    consumer:
      group-id: subscription-service
      auto-offset-reset: earliest
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    producer:
      properties:
        max.block.ms: 2000
        request.timeout.ms: 2000
        delivery.timeout.ms: 2000
        linger.ms: 0

consumer:
  retry:
    max-retries: 10
    initial-interval: 1s
    multiplier: 2.0
    max-interval: 30s

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level [traceId:%X{traceId} spanId:%X{spanId}] %logger{36} - %msg%n"
