spring:
  application:
    name: subscription-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/subscription}
    username: ${DATASOURCE_USERNAME:subscription}
    password: ${DATASOURCE_PASSWORD:subscription}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    #console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level [traceId=%X{traceId:-} spanId=%X{spanId:-}] %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level [traceId:%X{traceId} spanId:%X{spanId}] %logger{36} - %msg%n"