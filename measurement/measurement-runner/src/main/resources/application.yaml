springdotenv:
  directory: ../../

spring:
  application:
    name: measurement-runner
  main:
    banner-mode: off
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s

measurement:
  compose-directory: ../../
  results-directory: ../results
  kafka-connect-url: http://localhost:${KAFKA_CONNECT_PORT}
  subscription-service-url: http://localhost:${SUBSCRIPTION_SERVICE_PORT}
  load-count: 300
  load-rate-per-second: 10
  warm-up-timeout: 120s
  convergence-timeout: 120s
  databases:
    subscription:
      url: jdbc:postgresql://localhost:${SUBSCRIPTION_DB_PORT}/${SUBSCRIPTION_DB_NAME}
      username: ${SUBSCRIPTION_DB_USER}
      password: ${SUBSCRIPTION_DB_PASSWORD}
    payment:
      url: jdbc:postgresql://localhost:${PAYMENT_DB_PORT}/${PAYMENT_DB_NAME}
      username: ${PAYMENT_DB_USER}
      password: ${PAYMENT_DB_PASSWORD}
    psp:
      url: jdbc:postgresql://localhost:${PSP_DB_PORT}/${PSP_DB_NAME}
      username: ${PSP_DB_USER}
      password: ${PSP_DB_PASSWORD}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{0} - %msg%n"
