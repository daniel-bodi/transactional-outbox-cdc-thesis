name: transactional-outbox-cdc-thesis

services:

  subscription-db:
    image: postgres:18.6
    container_name: subscription-db
    environment:
      POSTGRES_DB: subscription
      POSTGRES_USER: subscription
      POSTGRES_PASSWORD: subscription
    command:
      - postgres
      - -c
      - wal_level=logical
    ports:
      - "5432:5432"
    volumes:
      - subscription-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U subscription -d subscription" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  subscription-db-data:
