name: transactional-outbox-cdc-thesis

services:

  subscription-db:
    image: postgres:18.6
    container_name: subscription-db
    environment:
      POSTGRES_DB: ${SUBSCRIPTION_DB_NAME}
      POSTGRES_USER: ${SUBSCRIPTION_DB_USER}
      POSTGRES_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
    ports:
      - "${SUBSCRIPTION_DB_PORT}:5432"
    volumes:
      - subscription-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SUBSCRIPTION_DB_USER} -d ${SUBSCRIPTION_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:18.6
    container_name: payment-db
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
    ports:
      - "${PAYMENT_DB_PORT}:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER} -d ${PAYMENT_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  psp-db:
    image: postgres:18.6
    container_name: psp-db
    environment:
      POSTGRES_DB: ${PSP_DB_NAME}
      POSTGRES_USER: ${PSP_DB_USER}
      POSTGRES_PASSWORD: ${PSP_DB_PASSWORD}
    ports:
      - "${PSP_DB_PORT}:5432"
    volumes:
      - psp-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PSP_DB_USER} -d ${PSP_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "${KAFKA_PORT}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-topics:
    image: apache/kafka:4.3.1
    container_name: kafka-topics
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: [ "/create-topics.sh" ]
    restart: "no"

  kafka-connect:
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      SUBSCRIPTION_DB_USER: ${SUBSCRIPTION_DB_USER}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD}
      SUBSCRIPTION_DB_NAME: ${SUBSCRIPTION_DB_NAME}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8083/connectors" ]
      interval: 5s
      timeout: 5s
      retries: 30

  subscription-service:
    build:
      context: ./backend
      args:
        MODULE: subscription-service
    image: thesis/subscription-service
    container_name: subscription-service
    depends_on:
      subscription-db:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      # crash point inactive by default
      FAULT_ACTIVE_CRASH_POINT_NAME: ${FAULT_ACTIVE_CRASH_POINT_NAME:-}
      FAULT_TARGET_REACH_COUNT: ${FAULT_TARGET_REACH_COUNT:-1}
      # V0 (dual-write baseline) instead of the transactional outbox, off by default
      DUAL_WRITE_ENABLED: ${DUAL_WRITE_ENABLED:-false}
      SUBSCRIPTION_SERVICE_PORT: 8080
      SUBSCRIPTION_DB_HOST: subscription-db
      SUBSCRIPTION_DB_PORT: 5432
      SUBSCRIPTION_DB_NAME: ${SUBSCRIPTION_DB_NAME}
      SUBSCRIPTION_DB_USER: ${SUBSCRIPTION_DB_USER}
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD}
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    ports:
      - "${SUBSCRIPTION_SERVICE_PORT}:8080"
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/actuator/health" ]
      # the healthy event marks the end of the outage after a crash point, 1 s keeps it precise
      interval: 1s
      timeout: 5s
      retries: 150

  payment-service:
    build:
      context: ./backend
      args:
        MODULE: payment-service
    image: thesis/payment-service
    container_name: payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      psp-mock-service:
        condition: service_healthy
    environment:
      # crash point inactive by default
      FAULT_ACTIVE_CRASH_POINT_NAME: ${FAULT_ACTIVE_CRASH_POINT_NAME:-}
      FAULT_TARGET_REACH_COUNT: ${FAULT_TARGET_REACH_COUNT:-1}
      # V0 (dual-write baseline) instead of the transactional outbox, off by default
      DUAL_WRITE_ENABLED: ${DUAL_WRITE_ENABLED:-false}
      PAYMENT_SERVICE_PORT: 8080
      PAYMENT_DB_HOST: payment-db
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      PSP_MOCK_HOST: psp-mock-service
      PSP_MOCK_PORT: 8080
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/actuator/health" ]
      # the healthy event marks the end of the outage after a crash point, 1 s keeps it precise
      interval: 1s
      timeout: 5s
      retries: 150

  psp-mock-service:
    build:
      context: ./backend
      args:
        MODULE: psp-mock-service
    image: thesis/psp-mock-service
    container_name: psp-mock-service
    depends_on:
      psp-db:
        condition: service_healthy
    environment:
      PSP_IDEMPOTENCYKEY_ENABLED: ${PSP_IDEMPOTENCYKEY_ENABLED:-true}
      PSP_MOCK_PORT: 8080
      PSP_DB_HOST: psp-db
      PSP_DB_PORT: 5432
      PSP_DB_NAME: ${PSP_DB_NAME}
      PSP_DB_USER: ${PSP_DB_USER}
      PSP_DB_PASSWORD: ${PSP_DB_PASSWORD}
    ports:
      - "${PSP_MOCK_PORT}:8080"
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect-cluster
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "${KAFKA_UI_PORT}:8080"

volumes:
  subscription-db-data:
  payment-db-data:
  psp-db-data:
  kafka-data:
